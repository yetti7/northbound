{% extends "base.html" %}
{% block title %}Sign In · Northbound{% endblock %}
{% block content %}
<section class="auth-card">
  <p class="eyebrow">Welcome Back</p>
  <h1>Sign In</h1>
  <form method="post" class="stacked-form">{% csrf_token %}{{ form.as_p }}<button class="button primary">Sign In</button></form>
  <p class="muted">New reader? <a href="{% url 'register' %}">Create an Account</a>.</p>
</section>
{% endblock %}
