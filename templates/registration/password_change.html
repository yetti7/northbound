{% extends "base.html" %}
{% block title %}Change Password · Northbound{% endblock %}
{% block content %}
<section class="auth-card task-card"><p class="eyebrow">My Account</p><h1>Change Password</h1><p class="lede">Enter your current password, then choose a new one.</p><form method="post" class="stacked-form standard-form">{% csrf_token %}{{ form.as_p }}<div class="form-actions"><button class="button primary">Update Password</button><a class="button secondary" href="{% url 'account' %}">Cancel</a></div></form></section>
{% endblock %}
