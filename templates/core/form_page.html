{% extends "base.html" %}
{% block content %}<section class="form-card"><p class="eyebrow">{{ eyebrow }}</p><h1>{{ title }}</h1>{% if form_note %}<p class="muted">{{ form_note }}</p>{% endif %}<form method="post" class="stacked-form">{% csrf_token %}{{ form.as_p }}<div class="form-actions"><button type="submit" class="button primary">Save</button>{% if logical_parent_url %}<a class="button secondary" href="{{ logical_parent_url }}">Cancel</a>{% endif %}</div></form></section>{% endblock %}
