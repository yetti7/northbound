{% extends "base.html" %}
{% block title %}Restoring Northbound{% endblock %}
{% block content %}<section class="auth-card"><p class="eyebrow">Restore in Progress</p><h1>Northbound Is Restarting</h1><p class="lede">Keep this page open. It will refresh automatically when the restored instance is ready.</p><p class="muted" id="restore-status">Waiting for Northbound to restart…</p></section><script>setInterval(async()=>{try{const response=await fetch("{% url 'health' %}",{cache:"no-store"});if(response.ok){const status=await response.json();if(!status.restore_pending){window.location.replace("{% url 'platform-backups' %}");}}}catch(error){document.querySelector("#restore-status").textContent="Northbound is offline while the restore is applied…";}},1500);</script>{% endblock %}
