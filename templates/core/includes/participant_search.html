<div class="participant-search challenge-submission-tools" data-participant-search hidden role="search" aria-label="Challenge participants">
  <label for="participant-search-query">Search User</label>
  <div class="submission-search-controls participant-search-controls">
    <input id="participant-search-query" type="search" placeholder="Username or Discord name" autocomplete="off">
    <button type="button" data-participant-clear disabled>Clear search</button>
  </div>
  <p role="status" data-participant-count></p>
</div>
<p class="empty-state" data-participant-empty hidden>No participants match your search.</p>
