{% if book.metadata_refresh_url %}<form method="post" action="{{ book.metadata_refresh_url }}" class="metadata-refresh-action">{% csrf_token %}<input type="hidden" name="version" value="{{ book.metadata_refresh_version }}"><button class="button secondary" type="submit">Refresh Metadata</button><p class="muted">{% if book.metadata_refresh_cover_only %}Cover artwork only while completed or awaiting review.{% else %}Updates display information; approved pages stay unchanged.{% endif %}</p></form>{% endif %}
