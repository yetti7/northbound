{% load static %}
<button type="button" class="global-search-trigger" aria-label="Search Northbound" aria-haspopup="dialog" aria-keyshortcuts="Control+k Meta+k" data-open-search>
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg>
  <span>Search Northbound…</span>
</button>
<dialog class="global-search" aria-labelledby="global-search-label" data-global-search data-url="{% url 'global-search' %}" data-group="{{ request.resolver_match.kwargs.group_slug|default:'' }}" data-month="{% firstof month.pk request.resolver_match.kwargs.month_pk '' %}">
  <div class="global-search-heading">
    <label id="global-search-label" for="global-search-query">Search Northbound</label>
    <button type="button" class="button secondary" data-close-search>Close</button>
  </div>
  <input id="global-search-query" type="search" maxlength="120" autocomplete="off" placeholder="Search Northbound…" autofocus>
  <p role="status" data-search-status></p>
  <div class="global-search-results" data-search-results></div>
</dialog>
<script src="{% static 'js/global_search.js' %}" defer></script>
