{% if branding.group_logo or branding.challenge_logo or branding.group_banner or branding.challenge_banner %}<div class="community-branding" aria-label="Community branding">
<div class="community-banners">{% if branding.group_banner %}<img class="community-banner" src="{{ branding.group_banner }}" alt="{{ branding.group_name }} banner" loading="lazy" data-community-image>{% endif %}
{% if branding.challenge_banner %}<img class="community-banner" src="{{ branding.challenge_banner }}" alt="{{ branding.challenge_name }} banner" loading="lazy" data-community-image>{% endif %}
</div><div class="community-logos">{% if branding.group_logo %}<figure><img src="{{ branding.group_logo }}" alt="{{ branding.group_name }} logo" loading="lazy" data-community-image><figcaption>{{ branding.group_name }}</figcaption></figure>{% endif %}{% if branding.challenge_logo %}<figure><img src="{{ branding.challenge_logo }}" alt="{{ branding.challenge_name }} logo" loading="lazy" data-community-image><figcaption>{{ branding.challenge_name }}</figcaption></figure>{% endif %}</div></div>{% endif %}
