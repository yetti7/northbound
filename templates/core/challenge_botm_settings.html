{% extends "base.html" %}
{% block title %}Book of the Month Settings · {{ month.name }}{% endblock %}
{% block content %}<section class="form-card"><p class="eyebrow"><a href="{% url 'challenge-settings' month.group.slug month.pk %}">Challenge Settings</a></p><div class="status-cluster"><h1>Book of the Month Settings</h1><span class="pill status-badge {% if month.botm_enabled %}status-success{% else %}status-inactive{% endif %}">{% if month.botm_enabled %}Enabled{% else %}Disabled{% endif %}</span></div><form method="post" class="stacked-form standard-form">{% csrf_token %}{{ form.as_p }}<div class="form-actions"><button class="button primary">Save Settings</button><a class="button secondary" href="{% url 'challenge-settings' month.group.slug month.pk %}">Cancel</a></div></form></section>{% endblock %}
