name: northbound

services:
  web:
    image: ghcr.io/yetti7/northbound:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NORTHBOUND_SQLITE_PATH: /data/northbound.sqlite3
      NORTHBOUND_MEDIA_ROOT: /data/media
      NORTHBOUND_SERVE_MEDIA: ${NORTHBOUND_SERVE_MEDIA:-1}
      PORT: ${PORT:-8000}
    ports:
      - "${NORTHBOUND_BIND_ADDRESS:-0.0.0.0}:${NORTHBOUND_PORT:-8000}:${PORT:-8000}"
    volumes:
      - northbound_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('PORT', '8000') + '/accounts/login/', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  northbound_data:
