name: northbound

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-northbound}
      POSTGRES_USER: ${POSTGRES_USER:-northbound}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-northbound} -d ${POSTGRES_DB:-northbound}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-northbound}
      POSTGRES_USER: ${POSTGRES_USER:-northbound}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      NORTHBOUND_MEDIA_ROOT: /app/media
      NORTHBOUND_SERVE_MEDIA: ${NORTHBOUND_SERVE_MEDIA:-1}
      PORT: ${PORT:-8000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${NORTHBOUND_BIND_ADDRESS:-0.0.0.0}:${NORTHBOUND_PORT:-8000}:${PORT:-8000}"
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('PORT', '8000') + '/accounts/login/', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  media_data:
