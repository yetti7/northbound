services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${NORTHBOUND_DATA_DIR:-/srv/appdata/northbound}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ${NORTHBOUND_IMAGE}
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${NORTHBOUND_BIND_ADDRESS:-127.0.0.1}:${NORTHBOUND_PORT:-8000}:8000"
    volumes:
      - ${NORTHBOUND_DATA_DIR:-/srv/appdata/northbound}/media:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/accounts/login/', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(request, timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
