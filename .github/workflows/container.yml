name: Build Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published, released]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  django-tests:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NORTHBOUND_SQLITE_PATH: /tmp/northbound-ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the complete maintained Django suite on an isolated database
        run: python manage.py test core reading_challenge --noinput --verbosity 1
      - name: Check release channel policy
        run: python -m unittest discover -s .github/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Personal TBR selection helpers
        run: node static/js/personal_tbr_registration_helpers.test.js

  postgres-checks:
    # The former dev-only restore dispatch is now a local validation workflow.
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: northbound
          POSTGRES_USER: northbound
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U northbound -d northbound"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://northbound:test-password@127.0.0.1:5432/northbound
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check PostgreSQL configuration and production migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput

  build-and-publish:
    # Serialize writes to each immutable version across tag pushes and release events.
    outputs:
      digest: ${{ steps.existing.outputs.digest || steps.publish.outputs.digest }}
      stable_release: ${{ steps.image-tags.outputs.stable }}
    concurrency:
      group: northbound-container-${{ github.ref }}
      cancel-in-progress: false
    needs: [django-tests, postgres-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check SQLite configuration and production migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput

      - name: Validate Compose deployments
        run: |
          cp .env.example .env
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example -f compose.yaml -f compose.dev.yaml config --quiet
          POSTGRES_PASSWORD=test-password \
            docker compose --env-file .env.example -f compose.yaml -f compose.postgres.yaml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select approved image tags
        id: image-tags
        run: python .github/scripts/release_channels.py select

      - name: Preserve existing immutable version image
        if: github.event_name != 'pull_request' && steps.image-tags.outputs.publish == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/release_channels.py existing

      - name: Generate image metadata
        if: github.event_name != 'pull_request' && steps.image-tags.outputs.publish == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Floating channels are promoted only after release-publication checks.
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.image-tags.outputs.version }},enable=${{ steps.image-tags.outputs.version != '' }}
            type=sha

      - name: Build and publish image
        if: github.event_name != 'pull_request' && steps.image-tags.outputs.publish == 'true' && steps.existing.outputs.exists != 'true'
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: NORTHBOUND_VERSION=${{ steps.image-tags.outputs.version || github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build pull request image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64

  promote-stable-release:
    needs: [build-and-publish]
    if: >-
      github.event_name == 'release' &&
      (github.event.action == 'published' || github.event.action == 'released') &&
      github.event.release.draft == false && github.event.release.prerelease == false &&
      github.event.release.published_at != '' &&
      needs.build-and-publish.outputs.stable_release == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: northbound-stable-release-channels
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote only the newest published stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.build-and-publish.outputs.digest }}
        run: python .github/scripts/release_channels.py promote
