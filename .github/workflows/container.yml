name: Build Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run checks and tests
        run: |
          python manage.py check
          python manage.py test

      - name: Validate Compose deployments and production media gateway
        run: |
          cp .env.example .env
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example -f compose.yaml -f compose.dev.yaml config --quiet
          NORTHBOUND_IMAGE=ghcr.io/${{ github.repository }}:latest \
            docker compose --env-file .env.example -f compose.production.yaml config --quiet
          mkdir -p "$RUNNER_TEMP/northbound-media/profile-pictures"
          cp static/branding/favicon-32.png "$RUNNER_TEMP/northbound-media/profile-pictures/media-check.png"
          docker run --detach --name northbound-media-check \
            --publish 127.0.0.1:18060:8000 \
            --add-host web:127.0.0.1 \
            --volume "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            --volume "$RUNNER_TEMP/northbound-media:/srv/media:ro" \
            nginx:1.30.4-alpine
          trap 'docker rm --force northbound-media-check' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error \
              --output "$RUNNER_TEMP/retrieved-media.png" \
              http://127.0.0.1:18060/media/profile-pictures/media-check.png; then
              break
            fi
            sleep 1
          done
          cmp static/branding/favicon-32.png "$RUNNER_TEMP/retrieved-media.png"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18060/media/profile-pictures/missing.png)" = "404"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Build and publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build pull request image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
